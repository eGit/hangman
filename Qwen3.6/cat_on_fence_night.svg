<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Night sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="60%" stop-color="#141852"/>
      <stop offset="100%" stop-color="#1a2a5e"/>
    </linearGradient>

    <!-- Moon glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e1" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffe082" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffb300" stop-opacity="0"/>
    </radialGradient>

    <!-- Cat body gradient -->
    <linearGradient id="catBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c2c2c"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>

    <!-- Star twinkle filter -->
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Moon shadow -->
    <filter id="moonShadow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <!-- Eye glow -->
    <filter id="eyeGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Fence post gradient -->
    <linearGradient id="fencePost" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3e2723"/>
      <stop offset="50%" stop-color="#5d4037"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </linearGradient>

    <!-- Cloud filter -->
    <filter id="cloudBlur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Stars -->
  <g filter="url(#starGlow)">
    <circle cx="50" cy="30" r="1.5" fill="#fff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="80" r="1" fill="#fff">
      <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="25" r="1.5" fill="#fff">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="310" cy="60" r="1" fill="#fff">
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="15" r="1.5" fill="#fff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="530" cy="45" r="1" fill="#fff">
      <animate attributeName="opacity" values="1;0.3;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="20" r="1.5" fill="#fff">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="710" cy="70" r="1" fill="#fff">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="40" r="1.5" fill="#fff">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="120" r="1" fill="#fff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="140" r="1.2" fill="#fff">
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="100" r="0.8" fill="#fff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="130" r="1.3" fill="#fff">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="90" r="1" fill="#fff">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="570" cy="110" r="1.5" fill="#fff">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="670" cy="100" r="0.8" fill="#fff">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="130" r="1.2" fill="#fff">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="180" r="1" fill="#fff">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="170" r="1.5" fill="#fff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="160" r="1" fill="#fff">
      <animate attributeName="opacity" values="1;0.3;1" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="200" r="0.8" fill="#fff">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="340" cy="190" r="1.2" fill="#fff">
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="690" cy="175" r="1" fill="#fff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="770" cy="190" r="1.5" fill="#fff">
      <animate attributeName="opacity" values="1;0.5;1" dur="2.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Moon -->
  <circle cx="680" cy="80" r="50" fill="url(#moonGlow)" filter="url(#moonShadow)"/>
  <circle cx="680" cy="80" r="35" fill="#fff8e1"/>
  <!-- Moon craters -->
  <circle cx="670" cy="70" r="6" fill="#ffe0b2" opacity="0.5"/>
  <circle cx="690" cy="85" r="4" fill="#ffe0b2" opacity="0.4"/>
  <circle cx="675" cy="95" r="8" fill="#ffe0b2" opacity="0.3"/>
  <circle cx="695" cy="65" r="3" fill="#ffe0b2" opacity="0.6"/>

  <!-- Clouds -->
  <g opacity="0.15" filter="url(#cloudBlur)">
    <ellipse cx="150" cy="100" rx="60" ry="20" fill="#fff">
      <animate attributeName="cx" values="150;180;150" dur="30s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="180" cy="95" rx="40" ry="15" fill="#fff">
      <animate attributeName="cx" values="180;210;180" dur="30s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="500" cy="60" rx="70" ry="18" fill="#fff">
      <animate attributeName="cx" values="500;540;500" dur="25s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="540" cy="55" rx="45" ry="14" fill="#fff">
      <animate attributeName="cx" values="540;580;540" dur="25s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Distant hills -->
  <path d="M0,380 Q100,340 200,370 Q300,350 400,365 Q500,340 600,360 Q700,345 800,370 L800,500 L0,500 Z" fill="#0d1117"/>
  <path d="M0,395 Q150,375 300,390 Q450,370 600,385 Q700,375 800,390 L800,500 L0,500 Z" fill="#111820"/>

  <!-- Trees silhouette -->
  <path d="M50,380 L50,320 L40,325 L50,300 L42,305 L50,280 L58,305 L50,300 L60,325 L50,320 Z" fill="#0a0e14"/>
  <path d="M750,380 L750,300 L735,310 L750,280 L738,290 L750,260 L762,290 L750,280 L765,310 L750,300 Z" fill="#0a0e14"/>
  <path d="M720,380 L720,330 L712,335 L720,315 L714,320 L720,300 L726,320 L720,315 L728,335 L720,330 Z" fill="#0a0e14"/>
  <path d="M90,380 L90,340 L82,345 L90,325 L84,330 L90,310 L96,330 L90,325 L98,345 L90,340 Z" fill="#0a0e14"/>

  <!-- ==================== FENCE ==================== -->
  <!-- Fence bottom rail -->
  <rect x="0" y="340" width="800" height="8" fill="url(#fencePost)" rx="1"/>

  <!-- Fence posts -->
  <g>
    <rect x="40" y="280" width="16" height="70" fill="url(#fencePost)" rx="2"/>
    <polygon points="36,280 48,265 60,280" fill="url(#fencePost)"/>
    <rect x="140" y="280" width="16" height="70" fill="url(#fencePost)" rx="2"/>
    <polygon points="136,280 148,265 160,280" fill="url(#fencePost)"/>
    <rect x="240" y="280" width="16" height="70" fill="url(#fencePost)" rx="2"/>
    <polygon points="236,280 248,265 260,280" fill="url(#fencePost)"/>
    <rect x="340" y="280" width="16" height="70" fill="url(#fencePost)" rx="2"/>
    <polygon points="336,280 348,265 360,280" fill="url(#fencePost)"/>
    <rect x="440" y="280" width="16" height="70" fill="url(#fencePost)" rx="2"/>
    <polygon points="436,280 448,265 460,280" fill="url(#fencePost)"/>
    <rect x="540" y="280" width="16" height="70" fill="url(#fencePost)" rx="2"/>
    <polygon points="536,280 548,265 560,280" fill="url(#fencePost)"/>
    <rect x="640" y="280" width="16" height="70" fill="url(#fencePost)" rx="2"/>
    <polygon points="636,280 648,265 660,280" fill="url(#fencePost)"/>
    <rect x="740" y="280" width="16" height="70" fill="url(#fencePost)" rx="2"/>
    <polygon points="736,280 748,265 760,280" fill="url(#fencePost)"/>
  </g>

  <!-- Fence top rail -->
  <rect x="0" y="276" width="800" height="10" fill="url(#fencePost)" rx="1"/>

  <!-- ==================== CAT ==================== -->
  <g>
    <!-- Walking animation: translate across fence -->
    <animateTransform attributeName="transform" type="translate" values="-100,0;750,0" dur="12s" repeatCount="indefinite"/>

    <!-- Cat body group (bobbing up and down) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0" dur="0.6s" repeatCount="indefinite"/>

      <!-- Tail -->
      <path d="M265,240 Q280,210 290,220 Q300,230 295,250" stroke="#2c2c2c" stroke-width="6" fill="none" stroke-linecap="round">
        <animate attributeName="d" values="
          M265,240 Q280,210 290,220 Q300,230 295,250;
          M265,240 Q275,200 285,210 Q295,220 290,245;
          M265,240 Q280,210 290,220 Q300,230 295,250" dur="0.6s" repeatCount="indefinite"/>
      </path>

      <!-- Back legs -->
      <g>
        <!-- Left back leg -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0,240,255;15,240,255;-10,240,255;0,240,255" dur="0.6s" repeatCount="indefinite"/>
          <rect x="230" y="250" width="8" height="28" rx="4" fill="#1a1a1a"/>
          <ellipse cx="234" cy="280" rx="6" ry="3" fill="#111"/>
        </g>
        <!-- Right back leg -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-10,250,255;5,250,255;20,250,255;-10,250,255" dur="0.6s" repeatCount="indefinite"/>
          <rect x="248" y="250" width="8" height="28" rx="4" fill="#1a1a1a"/>
          <ellipse cx="252" cy="280" rx="6" ry="3" fill="#111"/>
        </g>
      </g>

      <!-- Body -->
      <ellipse cx="245" cy="240" rx="35" ry="22" fill="url(#catBody)"/>

      <!-- Belly highlight -->
      <ellipse cx="245" cy="248" rx="25" ry="10" fill="#333" opacity="0.3"/>

      <!-- Front legs -->
      <g>
        <!-- Left front leg -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="15,210,255;5,210,255;-5,210,255;15,210,255" dur="0.6s" repeatCount="indefinite"/>
          <rect x="200" y="250" width="8" height="28" rx="4" fill="#1a1a1a"/>
          <ellipse cx="204" cy="280" rx="6" ry="3" fill="#111"/>
        </g>
        <!-- Right front leg -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-5,220,255;-15,220,255;0,220,255;-5,220,255" dur="0.6s" repeatCount="indefinite"/>
          <rect x="218" y="250" width="8" height="28" rx="4" fill="#1a1a1a"/>
          <ellipse cx="222" cy="280" rx="6" ry="3" fill="#111"/>
        </g>
      </g>

      <!-- Head -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0,205,218;3,205,218;-2,205,218;0,205,218" dur="0.6s" repeatCount="indefinite"/>

        <!-- Ears -->
        <polygon points="190,195 182,170 200,188" fill="#2c2c2c"/>
        <polygon points="192,193 186,175 198,189" fill="#3a2020"/>
        <polygon points="208,192 202,168 220,185" fill="#2c2c2c"/>
        <polygon points="210,190 205,173 218,187" fill="#3a2020"/>

        <!-- Head shape -->
        <ellipse cx="205" cy="215" rx="20" ry="18" fill="#2c2c2c"/>

        <!-- Eyes (glowing!) -->
        <g filter="url(#eyeGlow)">
          <ellipse cx="195" cy="212" rx="5" ry="7" fill="#4caf50">
            <animate attributeName="ry" values="7;1;7;7" dur="4s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="215" cy="212" rx="5" ry="7" fill="#4caf50">
            <animate attributeName="ry" values="7;1;7;7" dur="4s" repeatCount="indefinite"/>
          </ellipse>
          <!-- Pupils -->
          <ellipse cx="195" cy="212" rx="1.5" ry="5" fill="#000"/>
          <ellipse cx="215" cy="212" rx="1.5" ry="5" fill="#000"/>
          <!-- Eye shine -->
          <circle cx="193" cy="209" r="1.5" fill="#fff" opacity="0.8"/>
          <circle cx="213" cy="209" r="1.5" fill="#fff" opacity="0.8"/>
        </g>

        <!-- Nose -->
        <polygon points="203,220 207,220 205,223" fill="#c97878"/>

        <!-- Mouth -->
        <path d="M200,224 Q205,228 210,224" stroke="#555" stroke-width="0.8" fill="none"/>

        <!-- Whiskers -->
        <line x1="185" y1="218" x2="170" y2="215" stroke="#666" stroke-width="0.8"/>
        <line x1="183" y1="222" x2="168" y2="223" stroke="#666" stroke-width="0.8"/>
        <line x1="186" y1="226" x2="172" y2="230" stroke="#666" stroke-width="0.8"/>
        <line x1="225" y1="218" x2="240" y2="215" stroke="#666" stroke-width="0.8"/>
        <line x1="227" y1="222" x2="242" y2="223" stroke="#666" stroke-width="0.8"/>
        <line x1="224" y1="226" x2="238" y2="230" stroke="#666" stroke-width="0.8"/>
      </g>
    </g>
  </g>

  <!-- Ground shadow -->
  <ellipse cx="400" cy="355" rx="300" ry="10" fill="#000" opacity="0.3"/>

  <!-- Ground -->
  <rect x="0" y="350" width="800" height="150" fill="#0a0e14"/>
  <path d="M0,350 Q200,345 400,352 Q600,348 800,350 L800,500 L0,500 Z" fill="#0d1117"/>

  <!-- Grass tufts on fence -->
  <g fill="#1a3a1a">
    <path d="M30,276 L35,265 L40,276 Z"/>
    <path d="M130,276 L135,263 L140,276 Z"/>
    <path d="M230,276 L235,266 L240,276 Z"/>
    <path d="M330,276 L335,264 L340,276 Z"/>
    <path d="M430,276 L435,265 L440,276 Z"/>
    <path d="M530,276 L535,263 L540,276 Z"/>
    <path d="M630,276 L635,266 L640,276 Z"/>
    <path d="M730,276 L735,264 L740,276 Z"/>
  </g>

  <!-- Fireflies -->
  <g>
    <circle cx="100" cy="300" r="2" fill="#ffd54f">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;5,-10;-3,-5;0,0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="320" r="1.5" fill="#ffd54f">
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;-8,-5;3,-10;0,0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="290" r="2" fill="#ffd54f">
      <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;7,-8;-5,-3;0,0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="310" r="1.5" fill="#ffd54f">
      <animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;-6,-7;4,-4;0,0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="340" r="1" fill="#ffd54f">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;4,-6;-2,-8;0,0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="330" r="1.5" fill="#ffd54f">
      <animate attributeName="opacity" values="0;1;0" dur="3.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;-4,-9;6,-2;0,0" dur="7.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Moon reflection on ground puddle -->
  <ellipse cx="200" cy="420" rx="40" ry="8" fill="#fff8e1" opacity="0.1">
    <animate attributeName="opacity" values="0.05;0.15;0.05" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Subtle vignette -->
  <rect width="800" height="500" fill="url(#sky)" opacity="0.3" style="mix-blend-mode: multiply;"/>
</svg>
