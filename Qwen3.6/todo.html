<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <style>
    body {
      background-color: #f0f4f8;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 520px;
      width: 100%;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .counter {
      text-align: center;
      font-size: 14px;
      color: #555;
      margin-bottom: 16px;
    }
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .input-row input {
      flex: 1;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .input-row button {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background-color: #4a90d9;
      color: #fff;
    }
    .input-row button:hover {
      background-color: #357ab8;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #fff;
      padding: 10px 14px;
      margin-bottom: 6px;
      border-radius: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
      cursor: pointer;
      user-select: none;
    }
    li.completed span {
      text-decoration: line-through;
      color: #999;
    }
    li span {
      flex: 1;
    }
    li button.delete-btn {
      background: none;
      border: none;
      font-size: 16px;
      color: #aaa;
      cursor: pointer;
      padding: 0 4px;
    }
    li button.delete-btn:hover {
      color: #e74c3c;
    }
    .clear-row {
      text-align: right;
      margin-top: 12px;
    }
    .clear-row button {
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #e74c3c;
      border-radius: 4px;
      background: #fff;
      color: #e74c3c;
    }
    .clear-row button:hover {
      background: #e74c3c;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Task Manager</h1>
    <div class="counter" id="counter">Active: 0 | Completed: 0 | Total: 0</div>

    <div class="input-row">
      <input type="text" id="taskInput" placeholder="New task...">
      <button id="addBtn">Add Task</button>
    </div>

    <ul id="taskList"></ul>

    <div class="clear-row">
      <button id="clearBtn">Clear All</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "taskManager.tasks";
    const taskInput = document.getElementById("taskInput");
    const addBtn = document.getElementById("addBtn");
    const clearBtn = document.getElementById("clearBtn");
    const taskList = document.getElementById("taskList");
    const counterEl = document.getElementById("counter");

    let tasks = [];

    // --- Persistence ---
    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function loadTasks() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try {
          tasks = JSON.parse(raw);
        } catch {
          tasks = [];
        }
      } else {
        tasks = [
          { text: "Buy groceries", completed: false },
          { text: "Walk the dog", completed: false },
          { text: "Read a book", completed: false },
          { text: "Finish report", completed: false },
          { text: "Call mom", completed: false }
        ];
      }
    }

    // --- Rendering ---
    function updateCounter() {
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      const active = total - completed;
      counterEl.textContent = `Active: ${active} | Completed: ${completed} | Total: ${total}`;
    }

    function render() {
      taskList.innerHTML = "";
      tasks.forEach((task, index) => {
        const li = document.createElement("li");
        if (task.completed) li.classList.add("completed");

        const span = document.createElement("span");
        span.textContent = task.text;
        li.appendChild(span);

        const delBtn = document.createElement("button");
        delBtn.className = "delete-btn";
        delBtn.textContent = "\u2715";
        delBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          tasks.splice(index, 1);
          saveTasks();
          render();
        });
        li.appendChild(delBtn);

        li.addEventListener("click", function () {
          tasks[index].completed = !tasks[index].completed;
          saveTasks();
          render();
        });

        taskList.appendChild(li);
      });
      updateCounter();
    }

    // --- Add task ---
    function addTask() {
      const text = taskInput.value.trim();
      if (!text) return;
      tasks.push({ text: text, completed: false });
      taskInput.value = "";
      saveTasks();
      render();
    }

    addBtn.addEventListener("click", addTask);
    taskInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") addTask();
    });

    // --- Clear All ---
    clearBtn.addEventListener("click", function () {
      tasks = [];
      localStorage.removeItem(STORAGE_KEY);
      render();
    });

    // --- Init ---
    loadTasks();
    render();
  </script>
</body>
</html>
