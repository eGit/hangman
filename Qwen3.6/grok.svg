<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450">
  <defs>
    <!-- Soft glow for moon and eyes -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Gradient for night sky -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05051a"/>
      <stop offset="60%" stop-color="#0f0f2e"/>
      <stop offset="100%" stop-color="#1a1a3a"/>
    </linearGradient>
    
    <!-- Moon gradient -->
    <radialGradient id="moonGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="70%" stop-color="#f5e6b8"/>
      <stop offset="100%" stop-color="#e8d48b"/>
    </radialGradient>
  </defs>

  <style>
    .star {
      animation: twinkle 3s ease-in-out infinite;
    }
    .star:nth-child(2n) { animation-delay: 0.7s; animation-duration: 2.4s; }
    .star:nth-child(3n) { animation-delay: 1.4s; animation-duration: 3.8s; }
    .star:nth-child(5n) { animation-delay: 0.3s; animation-duration: 2.1s; }
    
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    
    .cat {
      animation: walk 12s linear infinite;
    }
    
    @keyframes walk {
      0%   { transform: translateX(-180px); }
      100% { transform: translateX(980px); }
    }
    
    .body-bounce {
      animation: bounce 0.45s ease-in-out infinite alternate;
    }
    
    @keyframes bounce {
      from { transform: translateY(0); }
      to   { transform: translateY(-6px); }
    }
    
    .leg {
      transform-origin: top center;
      animation: legWalk 0.45s ease-in-out infinite;
    }
    
    .leg.front-left  { animation-delay: 0s; }
    .leg.front-right { animation-delay: 0.225s; }
    .leg.back-left   { animation-delay: 0.225s; }
    .leg.back-right  { animation-delay: 0s; }
    
    @keyframes legWalk {
      0%   { transform: rotate(25deg); }
      50%  { transform: rotate(-25deg); }
      100% { transform: rotate(25deg); }
    }
    
    .tail {
      transform-origin: 20% 50%;
      animation: tailWag 1.2s ease-in-out infinite;
    }
    
    @keyframes tailWag {
      0%, 100% { transform: rotate(-15deg); }
      50%      { transform: rotate(20deg); }
    }
    
    .eye {
      animation: blink 4s ease-in-out infinite;
    }
    
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95%, 97%     { transform: scaleY(0.1); }
    }
  </style>

  <!-- Night sky -->
  <rect width="900" height="450" fill="url(#sky)"/>

  <!-- Distant hills / silhouette -->
  <path d="M0 320 Q150 280 300 310 T600 290 T900 330 L900 450 L0 450 Z" fill="#0a0a18" opacity="0.7"/>

  <!-- Stars -->
  <g fill="#fff">
    <circle class="star" cx="80" cy="60" r="1.5"/>
    <circle class="star" cx="160" cy="40" r="1"/>
    <circle class="star" cx="240" cy="90" r="1.8"/>
    <circle class="star" cx="320" cy="50" r="1.2"/>
    <circle class="star" cx="410" cy="75" r="1"/>
    <circle class="star" cx="490" cy="35" r="1.6"/>
    <circle class="star" cx="570" cy="95" r="1.3"/>
    <circle class="star" cx="680" cy="45" r="1.1"/>
    <circle class="star" cx="760" cy="70" r="1.7"/>
    <circle class="star" cx="840" cy="55" r="1.4"/>
    <circle class="star" cx="120" cy="130" r="1"/>
    <circle class="star" cx="290" cy="140" r="1.5"/>
    <circle class="star" cx="450" cy="120" r="1.2"/>
    <circle class="star" cx="610" cy="150" r="1"/>
    <circle class="star" cx="780" cy="130" r="1.6"/>
    <circle class="star" cx="50" cy="180" r="1.3"/>
    <circle class="star" cx="380" cy="160" r="1"/>
    <circle class="star" cx="720" cy="110" r="1.4"/>
  </g>

  <!-- Moon -->
  <circle cx="720" cy="90" r="48" fill="url(#moonGrad)" filter="url(#softGlow)"/>
  <!-- Moon craters -->
  <circle cx="700" cy="75" r="8" fill="#e0d0a0" opacity="0.4"/>
  <circle cx="735" cy="100" r="6" fill="#e0d0a0" opacity="0.35"/>
  <circle cx="710" cy="110" r="5" fill="#e0d0a0" opacity="0.3"/>

  <!-- Fence -->
  <g stroke="#3a2a1a" stroke-width="8" stroke-linecap="round">
    <!-- Horizontal rails -->
    <line x1="0" y1="280" x2="900" y2="280" stroke="#4a3520"/>
    <line x1="0" y1="310" x2="900" y2="310" stroke="#4a3520"/>
    <line x1="0" y1="340" x2="900" y2="340" stroke="#4a3520"/>
  </g>
  
  <!-- Fence posts -->
  <g fill="#2e1f12">
    <rect x="40" y="250" width="18" height="160" rx="2"/>
    <rect x="140" y="250" width="18" height="160" rx="2"/>
    <rect x="240" y="250" width="18" height="160" rx="2"/>
    <rect x="340" y="250" width="18" height="160" rx="2"/>
    <rect x="440" y="250" width="18" height="160" rx="2"/>
    <rect x="540" y="250" width="18" height="160" rx="2"/>
    <rect x="640" y="250" width="18" height="160" rx="2"/>
    <rect x="740" y="250" width="18" height="160" rx="2"/>
    <rect x="840" y="250" width="18" height="160" rx="2"/>
  </g>
  
  <!-- Post tops (rounded caps) -->
  <g fill="#3a2a1a">
    <ellipse cx="49" cy="250" rx="12" ry="6"/>
    <ellipse cx="149" cy="250" rx="12" ry="6"/>
    <ellipse cx="249" cy="250" rx="12" ry="6"/>
    <ellipse cx="349" cy="250" rx="12" ry="6"/>
    <ellipse cx="449" cy="250" rx="12" ry="6"/>
    <ellipse cx="549" cy="250" rx="12" ry="6"/>
    <ellipse cx="649" cy="250" rx="12" ry="6"/>
    <ellipse cx="749" cy="250" rx="12" ry="6"/>
    <ellipse cx="849" cy="250" rx="12" ry="6"/>
  </g>

  <!-- The Cat -->
  <g class="cat">
    <g class="body-bounce" transform="translate(0, 210)">
      <!-- Tail -->
      <path class="tail" d="M20 55 Q-10 30 -25 70 Q-15 50 5 55" 
            fill="none" stroke="#111" stroke-width="10" stroke-linecap="round"/>
      
      <!-- Back legs -->
      <g class="leg back-left">
        <line x1="35" y1="70" x2="25" y2="105" stroke="#111" stroke-width="9" stroke-linecap="round"/>
      </g>
      <g class="leg back-right">
        <line x1="55" y1="70" x2="65" y2="105" stroke="#111" stroke-width="9" stroke-linecap="round"/>
      </g>
      
      <!-- Body -->
      <ellipse cx="55" cy="55" rx="45" ry="25" fill="#111"/>
      
      <!-- Front legs -->
      <g class="leg front-left">
        <line x1="75" y1="65" x2="70" y2="100" stroke="#111" stroke-width="9" stroke-linecap="round"/>
      </g>
      <g class="leg front-right">
        <line x1="90" y1="65" x2="100" y2="100" stroke="#111" stroke-width="9" stroke-linecap="round"/>
      </g>
      
      <!-- Head -->
      <circle cx="100" cy="40" r="22" fill="#111"/>
      
      <!-- Ears -->
      <path d="M85 25 L80 5 L95 20 Z" fill="#111"/>
      <path d="M110 22 L120 4 L125 25 Z" fill="#111"/>
      <!-- Inner ears -->
      <path d="M87 22 L84 10 L93 18 Z" fill="#333"/>
      <path d="M113 20 L118 8 L122 22 Z" fill="#333"/>
      
      <!-- Eyes (glowing) -->
      <g class="eye" transform-origin="93px 38px">
        <ellipse cx="93" cy="38" rx="5" ry="6" fill="#ffdd44" filter="url(#glow)"/>
        <circle cx="94" cy="37" r="2" fill="#111"/>
      </g>
      <g class="eye" transform-origin="110px 38px">
        <ellipse cx="110" cy="38" rx="5" ry="6" fill="#ffdd44" filter="url(#glow)"/>
        <circle cx="111" cy="37" r="2" fill="#111"/>
      </g>
      
      <!-- Nose -->
      <ellipse cx="102" cy="48" rx="3" ry="2" fill="#ff9999"/>
      
      <!-- Whiskers -->
      <g stroke="#ccc" stroke-width="1.2" opacity="0.7">
        <line x1="102" y1="48" x2="75" y2="42"/>
        <line x1="102" y1="50" x2="72" y2="50"/>
        <line x1="102" y1="52" x2="75" y2="58"/>
        <line x1="102" y1="48" x2="130" y2="42"/>
        <line x1="102" y1="50" x2="133" y2="50"/>
        <line x1="102" y1="52" x2="130" y2="58"/>
      </g>
    </g>
  </g>

  <!-- Subtle ground shadow under fence -->
  <rect x="0" y="400" width="900" height="50" fill="#050510"/>
</svg>