<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color Palette Generator</title>
  <style>
    /* ---------- Reset & base ---------- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      color: #eee;
    }

    /* ---------- Header / Generate button ---------- */
    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem 0 1rem;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: .02em;
    }

    #generate-btn {
      padding: .55rem 1.4rem;
      font-size: .95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      transition: transform .15s ease, opacity .15s ease;
    }

    #generate-btn:hover { opacity: .85; }
    #generate-btn:active { transform: scale(.96); }

    .shortcut-hint {
      font-size: .75rem;
      opacity: .55;
    }

    /* ---------- Palette container ---------- */
    #palette {
      display: flex;
      width: 100%;
      height: 75vh;
    }

    /* ---------- Individual swatch ---------- */
    .swatch {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      cursor: pointer;
      position: relative;
      transition: background-color .4s ease;          /* smooth color swap */
      user-select: none;
    }

    /* HEX label */
    .swatch .hex {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: .04em;
      transition: color .4s ease;
    }

    /* Lock icon */
    .swatch .lock {
      position: absolute;
      top: .85rem;
      right: .85rem;
      font-size: 1.1rem;
      transition: transform .2s ease;
      line-height: 1;
    }

    .swatch .lock:hover { transform: scale(1.2); }

    /* ---------- Toast notification ---------- */
    #toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(0, 0, 0, .8);
      color: #fff;
      padding: .5rem 1.2rem;
      border-radius: 8px;
      font-size: .9rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <header>
    <h1>Color Palette Generator</h1>
    <button id="generate-btn">Generate</button>
    <span class="shortcut-hint">(Spacebar)</span>
  </header>

  <div id="palette"></div>

  <div id="toast"></div>

  <script>
    /* ============================================================
     * State
     * ============================================================ */

    // Array of { color (hex), locked (bool) }
    let palettes = [];
    const SWATCH_COUNT = 5;

    /* ============================================================
     * Helpers
     * ============================================================ */

    /** Generate a random hex color string. */
    function randomHex() {
      return '#' + Math.floor(Math.random() * 0xffffff)
        .toString(16)
        .padStart(6, '0');
    }

    /** Compute relative luminance (WCAG) to decide text colour. */
    function luminance(hex) {
      const r = parseInt(hex.slice(1, 3), 16) / 255;
      const g = parseInt(hex.slice(3, 5), 16) / 255;
      const b = parseInt(hex.slice(5, 7), 16) / 255;
      const toLinear = c => c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
      return 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
    }

    /** Return 'black' or 'white' depending on background brightness. */
    function textColorFor(hex) {
      return luminance(hex) > 0.5 ? '#000' : '#fff';
    }

    /** Copy text to clipboard via the Clipboard API. */
    async function copyToClipboard(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch {
        // Fallback for older browsers
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        return true;
      }
    }

    /* ============================================================
     * DOM references
     * ============================================================ */

    const paletteEl = document.getElementById('palette');
    const toastEl   = document.getElementById('toast');
    let toastTimer   = null;

    /** Show a brief toast message. */
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1200);
    }

    /* ============================================================
     * Palette construction
     * ============================================================ */

    /** Build the DOM for all swatches once. */
    function initPalette() {
      paletteEl.innerHTML = '';
      for (let i = 0; i < SWATCH_COUNT; i++) {
        const swatch = document.createElement('div');
        swatch.classList.add('swatch');
        swatch.dataset.index = i;

        // Lock icon
        const lock = document.createElement('span');
        lock.classList.add('lock');
        lock.textContent = '🔓';
        swatch.appendChild(lock);

        // HEX label
        const hex = document.createElement('span');
        hex.classList.add('hex');
        hex.textContent = '------';
        swatch.appendChild(hex);

        paletteEl.appendChild(swatch);

        // Click handler: copy hex OR toggle lock
        swatch.addEventListener('click', onSwatchClick);
      }
    }

    /** Apply a colour to a swatch DOM element. */
    function applyColor(swatch, hex) {
      swatch.style.backgroundColor = hex;
      const hexLabel = swatch.querySelector('.hex');
      hexLabel.textContent = hex.toUpperCase();
      hexLabel.style.color = textColorFor(hex);
    }

    /* ============================================================
     * Core logic
     * ============================================================ */

    /** Generate a brand-new palette (all unlocked). */
    function generatePalette() {
      const swatches = document.querySelectorAll('.swatch');

      palettes.forEach((slot, i) => {
        if (!slot.locked) {
          slot.color = randomHex();
        }
        applyColor(swatches[i], slot.color);
        // Update lock icon
        swatches[i].querySelector('.lock').textContent = slot.locked ? '🔒' : '🔓';
      });
    }

    /** Handle a click on a swatch. */
    async function onSwatchClick(e) {
      const swatch = e.currentTarget;
      const index  = parseInt(swatch.dataset.index, 10);
      const slot   = palettes[index];
      const lockEl = swatch.querySelector('.lock');

      // If the user clicked the lock icon, toggle lock.
      // Otherwise (clicked on swatch / hex), copy to clipboard.
      if (e.target.classList.contains('lock')) {
        slot.locked = !slot.locked;
        lockEl.textContent = slot.locked ? '🔒' : '🔓';
      } else {
        const ok = await copyToClipboard(slot.color.toUpperCase());
        if (ok) showToast('Copied ' + slot.color.toUpperCase());
      }
    }

    /* ============================================================
     * Event wiring
     * ============================================================ */

    document.getElementById('generate-btn').addEventListener('click', generatePalette);

    // Spacebar shortcut (prevent page scroll)
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !e.repeat) {
        e.preventDefault();
        generatePalette();
      }
    });

    /* ============================================================
     * Boot
     * ============================================================ */

    // Seed initial palette state
    for (let i = 0; i < SWATCH_COUNT; i++) {
      palettes.push({ color: randomHex(), locked: false });
    }

    initPalette();
    generatePalette();
  </script>
</body>
</html>
